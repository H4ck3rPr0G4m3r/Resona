[project]
name = "resona-engine"
version = "0.1.0"
description = "Resona streaming voice conversion engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "faiss-cpu>=1.9",
    "transformers>=4.47,<5",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torchfcpe>=0.0.4",
]

[project.optional-dependencies]
trt = ["tensorrt-cu12>=10.8", "onnx>=1.17"]

[dependency-groups]
dev = ["pytest>=8", "librosa>=0.10"]

[project.scripts]
resona-engine = "resona_engine.cli:main"

[tool.uv]
python-preference = "managed"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resona_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
