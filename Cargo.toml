[workspace]
resolver = "2"
members = ["host/shm-ipc", "host/audio-io", "host/dsp", "host/runtime", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Peter Nagy <nagy.peter.zalan@gmail.com>"]

[workspace.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
wasapi = "0.26"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "2"
anyhow = "1"

[profile.release]
debug = 1
